name: Ingest Express Entry draws

# Hourly refresh of the Derniers tirages (#49): asks the app to read IRCC's
# rounds feed, store new rounds and send Alertes tirages. Runs on GitHub
# Actions instead of Vercel Cron so the project stays on Vercel's free plan.
# Scheduled runs can start a few minutes late, and GitHub pauses schedules
# after 60 days without commits; re-enable from the Actions tab if so.

on:
  schedule:
    # Every hour at :07, off the top-of-the-hour queue.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-draws
  cancel-in-progress: false

permissions: {}

jobs:
  ingest:
    name: POST /api/cron/draws
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download IRCC's rounds feed
        # canada.ca can be slow from Vercel's servers on draw days; the runner
        # downloads the feed and sends it along. If this fails, the app reads
        # the feed itself, as before.
        continue-on-error: true
        run: |
          curl --silent --show-error --fail --compressed \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -H 'Accept: application/json' \
            -A 'StanzyImmigration/1.0 (+https://stanzy-immigration-consulting.com)' \
            -o feed.json \
            'https://www.canada.ca/content/dam/ircc/documents/json/ee_rounds_123_en.json'
          # Keep it only if it is JSON with rounds in it.
          jq -e '.rounds | length > 0' feed.json > /dev/null || rm -f feed.json
          ls -l feed.json 2>/dev/null || echo "No feed downloaded; the app will read it itself."

      - name: Trigger ingestion
        env:
          DRAWS_INGEST_URL: ${{ secrets.DRAWS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAWS_INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the DRAWS_INGEST_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          body=()
          if [ -f feed.json ]; then
            body=(-H 'Content-Type: application/json' --data-binary @feed.json)
          fi
          # --fail-with-body: a non-2xx answer fails the run and prints why.
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${body[@]}" \
            "$DRAWS_INGEST_URL"
          echo
