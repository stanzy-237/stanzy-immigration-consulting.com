name: Ingest Express Entry draws

# Hourly refresh of the Derniers tirages (#49): asks the app to read IRCC's
# rounds feed, store new rounds and send Alertes tirages. Runs on GitHub
# Actions instead of Vercel Cron so the project stays on Vercel's free plan.
# Scheduled runs can start a few minutes late, and GitHub pauses schedules
# after 60 days without commits; re-enable from the Actions tab if so.

on:
  schedule:
    # Every hour at :07, off the top-of-the-hour queue.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-draws
  cancel-in-progress: false

permissions: {}

jobs:
  ingest:
    name: POST /api/cron/draws
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger ingestion
        env:
          DRAWS_INGEST_URL: ${{ secrets.DRAWS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAWS_INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the DRAWS_INGEST_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          # --fail-with-body: a non-2xx answer fails the run and prints why.
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DRAWS_INGEST_URL"
          echo
