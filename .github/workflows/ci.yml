name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI has no database; skip runtime env validation and give Prisma a
      # syntactically valid URL so `prisma generate` is happy.
      SKIP_ENV_VALIDATION: '1'
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/db'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
