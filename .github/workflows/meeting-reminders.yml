name: Meeting reminders

# Every 5 minutes (#94): reminds of the coming Réunions, the day before and
# 15 minutes before. GitHub may start a scheduled run a few minutes late; the
# app sends each reminder once, whenever the run comes.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: meeting-reminders
  cancel-in-progress: false

permissions: {}

jobs:
  remind:
    name: POST /api/cron/meetings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders due
        env:
          # The same site as the draws job: …/api/cron/draws → …/api/cron/meetings.
          DRAWS_INGEST_URL: ${{ secrets.DRAWS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAWS_INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the DRAWS_INGEST_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          url="${DRAWS_INGEST_URL%/draws}/meetings"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url"
          echo
