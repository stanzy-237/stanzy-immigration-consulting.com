name: Meeting reminders

# Every 10 minutes from 07:00 to 23:50 in Douala (#94): reminds of the coming
# Réunions, the day before and 15 minutes before. GitHub may start a scheduled
# run a few minutes late; the app sends each reminder once, whenever the run
# comes, so the « 15 minutes » one lands 5 to 15 minutes before the start.
# Not every 5 minutes, night and day: each run wakes the database, and the
# old schedule kept it awake around the clock (Neon's free plan ran out in
# November 2026). A Réunion between midnight and 07:15 in Douala gets its
# day-before reminder but not the 15-minute one; run the workflow by hand if needed.

on:
  schedule:
    # 06:00–22:50 UTC = 07:00–23:50 in Douala.
    - cron: '*/10 6-22 * * *'
  workflow_dispatch:

concurrency:
  group: meeting-reminders
  cancel-in-progress: false

permissions: {}

jobs:
  remind:
    name: POST /api/cron/meetings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders due
        env:
          # The same site as the draws job: …/api/cron/draws → …/api/cron/meetings.
          DRAWS_INGEST_URL: ${{ secrets.DRAWS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAWS_INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the DRAWS_INGEST_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          url="${DRAWS_INGEST_URL%/draws}/meetings"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url"
          echo
