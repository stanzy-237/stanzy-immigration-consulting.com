name: Refresh TikTok carousel

on:
  schedule:
    # Weekly, Sunday 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: refresh-tiktok
  cancel-in-progress: false

jobs:
  refresh:
    name: Pull 6 latest @stanzycanada videos → Cloudflare R2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TIKTOK_CHANNEL: 'https://www.tiktok.com/@stanzycanada'
      DUMP_DIR: tmp/tiktok
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install upload-script dependency
        # The upload script only needs aws4fetch (R2's S3 API); skip the full
        # `npm ci` (which pulls dev deps + is sensitive to lockfile drift) and
        # install the one package into a scratch node_modules.
        run: npm install --no-save --prefix . aws4fetch@1.0.20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (needed for thumbnail conversion + mp4 remux)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp (latest) + curl-cffi impersonation
        # curl-cffi lets yt-dlp mimic a real browser's TLS fingerprint,
        # which TikTok's edge now requires on anonymous requests.
        run: pip install --upgrade "yt-dlp[default,curl-cffi]"

      - name: Download 6 latest videos + metadata
        run: |
          mkdir -p "$DUMP_DIR"
          yt-dlp \
            --impersonate chrome \
            --playlist-items 1-6 \
            --write-info-json \
            --write-thumbnail \
            --convert-thumbnails jpg \
            --no-write-playlist-metafiles \
            --format "mp4" \
            --output "$DUMP_DIR/%(id)s.%(ext)s" \
            "$TIKTOK_CHANNEL"

      - name: List dump
        run: ls -lh "$DUMP_DIR"

      - name: Upload to Cloudflare R2 + write manifest
        run: node scripts/refresh-tiktok.mjs
