name: Daily jobs

# Every morning (#92): reminds Clients of Factures due in 3 days or overdue,
# tells the consultant which are « En retard », sums up yesterday's new
# accounts, and deletes read notifications older than 6 months. Runs on
# GitHub Actions instead of Vercel Cron so the project stays on Vercel's free
# plan; the app makes each step safe to run twice.

on:
  schedule:
    # 06:15 UTC = 07:15 in Douala.
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  daily:
    name: POST /api/cron/daily
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the daily jobs
        env:
          # The same site as the draws job: …/api/cron/draws → …/api/cron/daily.
          DRAWS_INGEST_URL: ${{ secrets.DRAWS_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAWS_INGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the DRAWS_INGEST_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          url="${DRAWS_INGEST_URL%/draws}/daily"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url"
          echo
